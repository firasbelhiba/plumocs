# Continuous deployment for the backend.
#
# Push to main touching backend/ -> the server builds the image, runs pending
# migrations, restarts the containers, and rolls back if the result does not
# actually serve.
#
# WHY THE SERVER BUILDS RATHER THAN A REGISTRY. Building in CI and pulling an
# image is the better end state, but it needs registry credentials on the host
# and a token nobody rotates. The server has Docker, 53G free and the source it
# already checks out for deploy-native.sh. One less secret, one less thing to
# expire at 3am. Move to a registry when there is a second host to serve.
#
# Deliberately gated on the test job. A deploy that ships whatever was pushed is
# not automation, it is a faster way to break production.

name: deploy

on:
  # Re-armed after this workflow took production down on 2026-08-07 and both
  # causes were fixed and proven by a manual run that cut over with no downtime.
  #
  # What broke, so it is not reintroduced:
  #
  #   1. `docker compose` interpolates ${MIGRATE_DATABASE_URL} from the SHELL.
  #      env_file passes variables INTO a container; it does not define them for
  #      YAML substitution. compose would not parse the file at all, so even
  #      `up api worker` failed although only the migrate service uses it.
  #      deploy-container.sh now exports it and runs `compose config -q` first.
  #
  #   2. The script stopped systemd BEFORE it had any evidence the new build
  #      worked, so the first sign of trouble arrived after production was
  #      already down. It now smoke-tests the image on a spare port, against the
  #      real database, while the old stack keeps serving — and stops nothing
  #      until that passes.
  #
  # Anything that adds an irreversible step to this pipeline belongs AFTER that
  # smoke test, not before it.
  # CHAINED TO CI RATHER THAN RACING IT.
  #
  # This used to trigger on push, in parallel with the `backend` workflow, and
  # re-ran a smaller gate of its own. Two things were wrong with that. The
  # integration job — a real PostgreSQL with the split roles, the only thing that
  # executes a migration before production does — had NO say in whether a deploy
  # happened. And a migration-bearing push always went red, because the deploy
  # correctly refused to apply schema on its own, so a working pipeline looked
  # broken and a genuinely broken one looked the same.
  #
  # Now it waits for the whole of `backend` to pass. That is strictly stronger:
  # types, unit tests, container images AND the integration suite must be green
  # for this exact commit before anything reaches the server.
  workflow_run:
    workflows: ['backend']
    types: [completed]
    branches: [main]

  # Ship a known-good commit by hand — rollbacks, and re-running a deploy whose
  # SSH step flaked without pushing an empty commit to trigger it.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or tag to deploy (default: main)'
        required: false
        default: 'main'
      migrations:
        description: 'Apply pending migrations'
        type: boolean
        required: false
        default: false

# One deploy at a time. Two overlapping runs would race on the same working
# directory and the same containers, and the loser would leave a half-built
# image behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # THE GATE IS NOW THE `backend` WORKFLOW ITSELF — there is no duplicate here.
  #
  # It ran types, unit tests, the container image build and the integration suite
  # against a real PostgreSQL for this exact commit. Re-running a weaker subset
  # would only add minutes and a second thing to keep in sync.
  #
  # A failed or cancelled CI run still triggers workflow_run, so the conclusion
  # is checked explicitly. Without this line every red build would deploy.

  deploy:
    name: build and deploy on the server
    runs-on: ubuntu-latest
    environment: production
    # Deploy only when CI actually passed. workflow_run fires on failure and
    # cancellation too, so without this a red build would ship.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Generous: a cold `docker build` with no layer cache plus npm ci runs
          # for several minutes. Too short and the step fails after the restart
          # has already happened, which reads as a broken deploy that in fact
          # succeeded.
          command_timeout: 20m
          # WITH_MIGRATIONS is on for a CI-triggered deploy, and that is a
          # deliberate change of policy rather than a convenience.
          #
          # It was off because a deploy that quietly migrates can quietly destroy
          # data, and nothing had ever executed a migration before production did.
          # That is no longer true: the integration job applies every migration to
          # a real PostgreSQL 18 with the same split roles, and it has already
          # earned it — it caught a rename that left five NOT NULL constraints
          # behind, which would have failed identically on the server.
          #
          # The remaining protections are unchanged and are what make this safe:
          # deploy-container.sh takes a fresh backup before migrating, smoke-tests
          # the new image against the live database on a spare port BEFORE
          # stopping anything, and rolls back if the result does not serve.
          #
          # A manual dispatch still defaults to OFF. Deploying a hand-picked ref
          # has not been through CI, so it does not get CI's permission.
          script: |
            set -Eeuo pipefail
            REF="${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}"
            export WITH_MIGRATIONS="${{ github.event_name == 'workflow_run' && '1' || (github.event.inputs.migrations == 'true' && '1' || '0') }}"
            echo "deploying $REF (migrations: $WITH_MIGRATIONS)"

            # Sync the checkout BEFORE running the script that lives in it.
            # Otherwise this is a bootstrap paradox: the first deploy of a new
            # ops script cannot run, because the server's copy predates it, and
            # a script cannot fetch itself into existence. That is exactly how
            # the first run of this workflow failed.
            SRC=/opt/plumo-cs/source
            if [ ! -d "$SRC/.git" ]; then
              sudo mkdir -p "$SRC" && sudo chown -R "$(id -u):$(id -g)" "$SRC"
              git clone https://github.com/firasbelhiba/plumocs.git "$SRC"
            fi
            git -C "$SRC" fetch --prune origin
            git -C "$SRC" checkout -qf "$REF" --detach

            bash "$SRC/backend/ops/deploy-container.sh" "$REF"
