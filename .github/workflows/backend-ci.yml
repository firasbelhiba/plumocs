# Backend CI.
#
# This exists because `main` sat with 30 TypeScript errors for several days and
# nobody noticed — the backend could not have been rebuilt or redeployed in an
# emergency during that window, and it was only discovered when a container
# build failed. Both jobs below would have caught it in under two minutes.
#
# Two jobs, deliberately:
#   check        fast, no services. Types, unit tests, real build.
#   integration  a real PostgreSQL with the SPLIT ROLES, so the row-level
#                security tests mean something.
#
# The integration job is the important one. Isolation tests connected as a
# superuser or as the table owner are exempt from every RLS policy and would
# report perfect tenant separation whether or not a single policy existed —
# which is why global-setup.ts refuses to run on a privileged connection. CI
# provisions plumo_app / plumo_migrator exactly as production does, so a broken
# policy fails here instead of in front of a customer.

name: backend

on:
  push:
    branches: [main, 'tenancy-*', 'phase-*']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match production exactly. The server runs v22; a CI green on a
          # different major is a weaker signal than it looks.
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Must precede tsc: the app imports types from the generated client, and
      # without this every Prisma call is an error for the wrong reason.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Separate invocation because the root tsconfig EXCLUDES `test/`, so the
      # step above says nothing about the integration suite. That gap is how the
      # suite came to be broken by the tenancy migration without CI noticing:
      # the only thing compiling it was ts-jest, inside the integration job
      # below, so a plain type error surfaced as a failure in the one job that
      # needs a database and read like an infrastructure flake.
      - name: Typecheck integration suite
        run: npx tsc --noEmit -p test/integration/tsconfig.json

      # Includes src/app.module.spec.ts, which resolves the entire Nest
      # dependency graph. TypeScript cannot see DI wiring — a controller can
      # inject a service its module never imports and the build stays green —
      # so without this the failure first appears when the container starts.
      # That has already put a 502 in production once.
      - name: Unit tests (includes Nest DI resolution)
        run: npm test

      # `nest build` is not the same check as tsc --noEmit — this is the
      # artifact that actually gets deployed.
      - name: Build
        run: npm run build

  integration:
    name: integration (real postgres, split roles)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 18 to match production. The tenancy migration uses the
        # PG15+ `ON DELETE SET NULL (column)` form and partial indexes; testing
        # on an older major would pass here and fail on the server.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plumo_cs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Throwaway credentials — this database exists for the length of one job.
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plumo_cs_test
      PLUMO_APP_PASSWORD: ci_app_pw
      PLUMO_MIGRATOR_PASSWORD: ci_migrator_pw
      DATABASE_URL: postgresql://plumo_app:ci_app_pw@localhost:5432/plumo_cs_test?schema=public
      MIGRATE_DATABASE_URL: postgresql://plumo_migrator:ci_migrator_pw@localhost:5432/plumo_cs_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-not-a-real-secret
      JWT_REFRESH_SECRET: ci-not-a-real-secret-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Creates plumo_migrator (schema owner) and plumo_app (runtime, owns
      # nothing, NOSUPERUSER, NOBYPASSRLS) — the same split the server runs.
      #
      # Necessarily BEFORE the migrations: from the tenancy cutover onward
      # almost every migration GRANTs to plumo_app by name, and a GRANT to a
      # role that does not exist is an error rather than a no-op. roles.sql is
      # written for this order — its REVOKE on `workspaces` is guarded on the
      # table existing precisely because here it does not yet.
      - name: Provision split roles
        run: npm run db:roles

      # THE MIGRATIONS GO ON IN TWO PASSES, AND THE REASON IS THE ENTIRE HISTORY
      # OF THIS JOB NEVER HAVING GONE GREEN.
      #
      # 20260802000000_workspace_tenancy is an IN-PLACE CUTOVER, not a schema
      # definition. It was written against a database that had been live for
      # four days, and three separate things in it need rows that only a live
      # database has:
      #
      #   preflight       refuses outright: `IF NOT EXISTS (SELECT 1 FROM users)`
      #   section 5       builds the bootstrap memberships by SELECTing users
      #   assertion (13)  demands an active admin membership and a platform
      #                   admin, both of which sections 5 and 6 derive from users
      #
      # A fresh database has no users, so that file is structurally incapable of
      # applying here and "Apply migrations" failed on every run this workflow
      # has ever had — which is why the isolation specs below have never once
      # executed. Production is not a counter-example: it applied this migration
      # once, to a database with 38 real conversations already in it.
      #
      # None of the three guards is wrong. A cutover that adopts nobody has
      # silently locked every human out of the instance, and refusing is the
      # correct answer. So CI reproduces the PRECONDITION rather than removing
      # it: bring the schema up to the state it had the moment before the
      # cutover, seat one user the way the server already had one, then apply
      # the cutover and everything after it. Splitting the deploy is the only
      # way to get a row in between two migrations — `migrate deploy` has no
      # `--to`, and the table does not exist before the pass below.
      #
      # Nothing else about the run changes: same files, same order, same
      # plumo_migrator credential, same _prisma_migrations bookkeeping the
      # server keeps.
      - name: Apply migrations — up to the tenancy cutover
        env:
          CUTOVER: 20260802000000_workspace_tenancy
        run: |
          mkdir -p "$RUNNER_TEMP/after-cutover"
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            [[ "$name" < "$CUTOVER" ]] || mv "$dir" "$RUNNER_TEMP/after-cutover/"
          done
          DATABASE_URL="$MIGRATE_DATABASE_URL" npx prisma migrate deploy

      # One row, and this is the only window in the chain where it can be
      # written: `users` does not exist before the pass above, and the pass
      # below DROPs the role, team_id and availability columns off it.
      #
      # role = 'admin' is load-bearing rather than decorative. Section 5 copies
      # users.role onto the membership it creates, and assertion (13) fails the
      # whole migration when no ACTIVE ADMIN membership falls out of it.
      #
      # updated_at is passed explicitly because its `DEFAULT now()` is added by
      # section 1 of the very migration this is preparing for; without it the
      # INSERT dies on a not-null violation for a column nobody thinks about.
      #
      # The password hash is deliberately not a hash. Nothing authenticates in
      # this job, and a real argon2 digest sitting in a workflow file is a
      # credential somebody eventually copies somewhere it matters.
      #
      # libpq rejects Prisma's `?schema=` query parameter outright ("invalid URI
      # query parameter"), so it is stripped — psql wants a plain connection URI
      # and `public` is the default search path anyway.
      - name: Seat the user the cutover adopts
        run: |
          psql "${MIGRATE_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO users (email, name, role, password_hash, is_active, updated_at)
             VALUES ('ci-bootstrap@plumo.invalid', 'CI bootstrap', 'admin', 'not-a-hash', true, now())"

      # As plumo_migrator, because the tenancy migration refuses to run as
      # anyone else — a guard that has already caught a mistake in production.
      - name: Apply migrations — the cutover and everything after it
        run: |
          mv "$RUNNER_TEMP"/after-cutover/* prisma/migrations/
          DATABASE_URL="$MIGRATE_DATABASE_URL" npx prisma migrate deploy

      # The one failure the split above introduces that nothing else would
      # catch: a migration directory moved aside and never moved back applies
      # nothing, reports success, and leaves the isolation specs asserting
      # against a half-migrated schema — a green run that proves nothing, which
      # is the exact shape this job exists to prevent.
      #
      # Counted from the catalogue rather than read off `prisma migrate status`,
      # so it rests on no exit-code convention and no message wording.
      - name: Every migration on disk is applied
        run: |
          on_disk=$(ls -1d prisma/migrations/*/ | wc -l)
          applied=$(psql "${MIGRATE_DATABASE_URL%%\?*}" -tAc \
            "SELECT count(*) FROM _prisma_migrations
              WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")
          echo "$applied of $on_disk migrations applied"
          test "$on_disk" -eq "$applied"

      # global-setup.ts asserts the connection is unprivileged before the first
      # spec, so a misprovisioned role fails loudly here rather than silently
      # making every isolation test pass.
      - name: Integration tests
        run: npm run test:integration

  # The container images.
  #
  # THESE HAVE NEVER BEEN BUILT. The Dockerfile and compose files were written
  # for a cutover that was deferred, and an unbuilt Dockerfile is a guess: it
  # drifts silently as the app changes and only fails on the day somebody needs
  # it in a hurry. Docker is installed on neither the production host nor any
  # development machine here, so CI is the only place this can be proven at all.
  #
  # Deliberately does NOT push anywhere. Its whole job is to answer "would this
  # build if we needed it", every time the backend changes, for free.
  image:
    name: container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The runtime image the api and worker would both run from.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          tags: plumo-cs:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A separate target because `prisma` is a devDependency: the runtime image
      # is installed with --omit=dev and physically cannot run migrate deploy.
      # If this target ever breaks, migrations silently become a manual host step
      # again — which is the thing containerising was meant to remove.
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrate
          tags: plumo-cs-migrate:ci
          load: true
          cache-from: type=gha

      # `docker build` succeeding proves the layers assemble, not that the thing
      # inside is runnable. Both entrypoints are checked because the api and the
      # worker share one image and differ only in which file they start — a build
      # that produced main.js but not worker.js would look completely healthy
      # until the worker container crash-looped in production.
      - name: The artifacts the compose services actually start exist
        run: |
          docker run --rm --entrypoint node plumo-cs:ci -e "require('fs').accessSync('/app/dist/main.js')"
          docker run --rm --entrypoint node plumo-cs:ci -e "require('fs').accessSync('/app/dist/worker.js')"

      # Runs as `node`, never root. This container holds the schema-owner
      # credential and is the most dangerous one in the stack.
      - name: Images run unprivileged
        run: |
          test "$(docker run --rm --entrypoint id plumo-cs:ci -un)" = node
          test "$(docker run --rm --entrypoint id plumo-cs-migrate:ci -un)" = node

      # Proves the prisma CLI and its engines actually load in the migrate image,
      # as the unprivileged `node` user it runs as.
      #
      # `--version` rather than `migrate deploy --help`: the latter was the first
      # attempt and it failed, and it is the weaker probe of the two. It can exit
      # non-zero for reasons that say nothing about the image — a schema that
      # cannot be resolved, a missing DATABASE_URL — whereas `--version` loads the
      # CLI and reports the engine build it found, which is exactly the thing that
      # must survive the multi-stage copy. If prisma is absent or its engines are
      # unreadable, this cannot pass.
      #
      # The diagnostics run FIRST and unconditionally. The migrate stage inherits
      # /app from `build`, where every layer ran as root, and then switches to
      # USER node — so the tree is root-owned and node has read-only access to it.
      # `runtime` survives that because it only ever reads; a CLI that wants to
      # write a cache does not. Printing who we are, where HOME points and whether
      # it is writable turns "it failed" into a diagnosis without another round
      # trip through CI.
      - name: Migrate image — diagnostics
        run: |
          echo "user: $(docker run --rm --entrypoint id plumo-cs-migrate:ci)"
          echo "home: $(docker run --rm --entrypoint printenv plumo-cs-migrate:ci HOME || echo unset)"
          docker run --rm --entrypoint sh plumo-cs-migrate:ci -c \
            'ls -ld /app /app/node_modules/.bin/prisma 2>&1; test -w "$HOME" && echo "HOME writable" || echo "HOME NOT writable"'

      # Both invocations, on purpose. The bin is what CMD actually runs, and npx
      # is what a human will reach for when debugging a container at 2am — if
      # HOME regresses, npx breaks first and this catches it there.
      - name: Migrate image can run prisma
        run: |
          docker run --rm --entrypoint node_modules/.bin/prisma plumo-cs-migrate:ci --version
          docker run --rm --entrypoint npx plumo-cs-migrate:ci prisma --version
