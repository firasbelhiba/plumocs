<!-- Ported from plumo PM (public/brand/empty-states) with the one palette
     substitution the CS pillar is exempt on. PM draws these in the blue
     triad, which would put the accent blue on a full-screen surface in a
     green product, so each blue is mapped to its CS counterpart and
     nothing else is changed:
       1E3A8A (plumo night, ink and strokes) becomes 1F4A2E (cs forest)
       EFF6FF (plumo mist, soft fill)        becomes EDF4EE (cs soft)
       60A5FA (plumo sky)                    becomes 7CC098, which is
              hsl(145 35% 62%) : the CS primary in dark, exactly where
              PM binds its own dark primary to plumo sky.
     The peach and butter accents are shared by both pillars and are
     copied verbatim. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" shape-rendering="geometricPrecision">
  <title>Plumo no permissions — quiet, respecting the wall</title>
  <defs>
    <filter id="ss-perm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- A soft mist lock floating above-right of the blob (the wall, but gentle) -->
  <g transform="translate(220 65)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0"
        keyTimes="0; 0.5; 1"
        dur="3.6s" repeatCount="indefinite"/>
      <!-- lock body -->
      <rect x="12" y="32" width="48" height="36" rx="6" fill="#EDF4EE" stroke="#1F4A2E" stroke-width="2.5"/>
      <!-- shackle -->
      <path d="M 22 32 L 22 22 Q 22 8 36 8 Q 50 8 50 22 L 50 32" fill="none" stroke="#1F4A2E" stroke-width="2.5" stroke-linecap="round"/>
      <!-- keyhole dot -->
      <circle cx="36" cy="48" r="3.5" fill="#1F4A2E"/>
      <path d="M 36 51 L 36 56" stroke="#1F4A2E" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The respectful blob — eyes looking down/away (not at the lock), giving it space -->
  <g filter="url(#ss-perm)" transform="translate(90 100)">
    <g>
      <!-- very subtle sway -->
      <animateTransform attributeName="transform" type="rotate"
        values="0; 1; 0"
        keyTimes="0; 0.5; 1"
        dur="4.5s" repeatCount="indefinite"
        additive="sum"/>
      <path d="M 40 4 C 60 2, 75 18, 73 38 C 81 48, 73 65, 56 66 C 51 76, 32 76, 23 68 C 5 71, -2 52, 8 40 C 0 22, 20 4, 40 4 Z"
            fill="#EDF4EE" stroke="#1F4A2E" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- eyes looking down — small horizontal arches positioned lower -->
      <path d="M 22 38 Q 28 41, 34 38" fill="none" stroke="#1F4A2E" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 46 38 Q 52 41, 58 38" fill="none" stroke="#1F4A2E" stroke-width="3.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
